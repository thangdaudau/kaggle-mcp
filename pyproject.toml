[project]
name = "kaggle-mcp"
version = "0.1.0"
description = "MCP server to run Python jobs on Kaggle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "peapea", email = "54851828+thangdaudau@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.5",
    "mcp>=1.20",
    "requests>=2.34.2",
    "six>=1.17.0",
]

[project.scripts]
kaggle-mcp = "kaggle_mcp.server:main"
kjob = "kaggle_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
